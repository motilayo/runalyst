name: Generate Seed Data

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_seed_runs.py'
      - 'scripts/train_model.py'
      - '.github/workflows/generate-seed-data.yml'
  workflow_dispatch: # Allow manual triggering

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn coremltools
        
      - name: Generate Seed Data
        run: python3 scripts/generate_seed_runs.py

      - name: Train CoreML Model
        run: python3 scripts/train_model.py
        
      - name: Upload Generated CSV and Model
        uses: actions/upload-artifact@v4
        with:
          name: coreml-training-artifacts
          path: |
            *.csv
            RunalystClassifier.mlmodel
          retention-days: 14
