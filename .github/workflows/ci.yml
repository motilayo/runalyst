name: CI Quality & Security Gates

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Runalyst/**'
      - 'RunalystCore/**'
      - 'RunalystTests/**'
      - 'RunalystUITests/**'
      - 'Runalyst.xcodeproj/**'
      - 'Runalyst.xcworkspace/**'
      - 'ci_scripts/**'
      - 'BuildSettings.xcconfig'
      - 'PrivacyInfo.xcprivacy'
      - '.swiftlint.yml'
      - '.swiftformat'
      - 'assay.sh'
      - '.github/workflows/ci.yml'
      - '*.swift'
      - '*.mlmodel'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Runalyst/**'
      - 'RunalystCore/**'
      - 'RunalystTests/**'
      - 'RunalystUITests/**'
      - 'Runalyst.xcodeproj/**'
      - 'Runalyst.xcworkspace/**'
      - 'ci_scripts/**'
      - 'BuildSettings.xcconfig'
      - 'PrivacyInfo.xcprivacy'
      - '.swiftlint.yml'
      - '.swiftformat'
      - 'assay.sh'
      - '.github/workflows/ci.yml'
      - '*.swift'
      - '*.mlmodel'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Secret Scanning (Fast fail)
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Reference Core Assay & Strict SwiftLint (All 5 Constitutional Gates)
  assay-and-lint:
    name: Reference Core Assay & SwiftLint Gate
    runs-on: macos-26
    needs: [secret-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Ensure SwiftLint Installed
        run: |
          if ! which swiftlint >/dev/null; then
            brew install swiftlint
          fi

      - name: Execute Reference Core Assay (./assay.sh)
        run: |
          chmod +x ./assay.sh
          ./assay.sh

  # 3. Foundry iOS Build & Automated Test Suite (Single Execution)
  build-and-test:
    name: Build & Test Suite
    runs-on: macos-26
    needs: [secret-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Discover Available iOS Simulator
        id: simulator
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/^[[:space:]]+//; s/ \([A-F0-9-]+\).*//')
          echo "Using simulator device: $DEVICE_NAME"
          echo "device=$DEVICE_NAME" >> $GITHUB_OUTPUT

      - name: Build and Test Runalyst
        run: |
          xcodebuild \
            -project Runalyst.xcodeproj \
            -scheme Runalyst \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build test
