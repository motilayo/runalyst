# SwiftLint Configuration for Runalyst

included:
  - Runalyst
  - RunalystTests
  - RunalystWatch

excluded:
  - DerivedData
  - Build
  - .build
  - "**/*.generated.swift"

# Enabled rules focused on safety and code hygiene
opt_in_rules:
  - empty_count
  - force_unwrapping
  - fatal_error_message
  - multiline_parameters
  - redundant_nil_coalescing
  - strict_fileprivate
  - contains_over_filter_count
  - first_where
  - modifier_order
  - closure_spacing
  - weak_delegate

disabled_rules:
  - line_length # Screen layouts and AI prompts can exceed standard line lengths
  - todo # Tracked via GitHub issues/tickets
  - multiple_closures_with_trailing_closure # Standard idiomatic SwiftUI layout modifier usage
  - large_tuple # HealthKit metrics aggregate calculation returns multi-value tuples
  - file_length # Comprehensive SwiftUI views and drill builders exceed default limits
  - type_body_length # Core dashboard and views exceed default body lengths
  - function_body_length # WorkoutKit complex drill block builders
  - cyclomatic_complexity # Workout builders matrix across 9 drill types and 3 durations

# Rule configurations
force_unwrapping:
  severity: error

force_cast:
  severity: error

force_try:
  severity: error

identifier_name:
  min_length:
    warning: 1
    error: 1
  excluded:
    - on
    - id
    - hr
    - cv
    - g
    - c
    - to

# Custom rules for Runalyst-specific best practices
custom_rules:
  no_direct_nslog:
    name: "Avoid NSLog"
    regex: "NSLog\\("
    message: "Use os.Logger or print for debugging instead of NSLog."
    severity: warning
